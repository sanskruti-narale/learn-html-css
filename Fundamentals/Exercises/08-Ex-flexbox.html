<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flextbox Exercise</title>

  <style>

    .flex {
      display:flex;
      flex-direction:row;
      justify-content:space-between;
      align-items:center;
      background-color: rgb(141, 89, 189);
      padding: 12px;
      height:30px;
    }

    .home {
      color: white;
      font-weight: bold;
      width: 150px;
    }
    .search {
      flex: 1;
      margin-right: 30px;
      margin-left:20px;
      max-width:500px;
    }

    .button {
      width: 150px;
      text-align: center;
    }

    .searchbox {
      border:none;
      border-radius: 20px;
      width:100%;
      height:28px
    }

    .download-button {
      background-color: rgb(141, 89, 189);
      border: 1px solid white;
      padding:8px 15px;
      color:white;
    }
  </style>
</head>
<body>
  <div class="flex">
    <div class="home">
      Home
    </div>
    <div class="search">
      <input class="searchbox" type="text" placeholder="search">
    </div>
    <div class="button">
      <button class="download-button">Download</button>
    </div>
  </div>
</body>
</html>
