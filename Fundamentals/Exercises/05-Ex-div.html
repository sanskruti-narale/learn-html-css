<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Div Practice</title>
  <style>
    .card{
      width:200px;
      display:inline-block;
      box-shadow: 3px 3px 4px gray;
    }
    
    .image{
      width:200px;
    }
    .text{
      padding-left:7px;
      padding-bottom: 7px;
      line-height: 5px;
    }
    .name{
      font-weight: bold;
    }
    .friends{
      color:rgb(90, 89, 89);
    }
    .add-button{
      background-color:rgb(12, 92, 211);
      color: white;
      border:none;
      border-radius:4px;
      padding:6px 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="image" src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-1.webp" alt="image1">
    <div class="text">
      <p class="name">Oliver</p>
      <p class="friends">2 mutual friends</p>
      <button class="add-button">Add Friend</button>
    </div>
  </div>

  <div class="card">
    <img class="image" src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-2.webp" alt="image1">
    <div class="text">
      <p class="name">Jennifer</p>
      <p class="friends">3 mutual friends</p>
      <button class="add-button">Add Friend</button>
    </div>
  </div>

  <div class="card">
    <img class="image" src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-3.webp" alt="image1">
    <div class="text">
      <p class="name">Lucas</p>
      <p class="friends">4 mutual friends</p>
      <button class="add-button">Add Friend</button>
    </div>
  </div>

</body>
</html>
