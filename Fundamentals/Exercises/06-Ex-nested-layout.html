<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nested Layout Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>

    p{
      font-family:Roboto, Arial;
      margin-top: 0;
      margin-bottom: 0;
    }

    .video-list{
      margin-left:10px;
      margin-top:20px;
      width:500px;
    }
    .thumbnail{
      width:200px;
    }

    .thumbnail-column{
      display:inline-block;
    }

    .video-info{
      display: inline-block;
      vertical-align: top;
      width:280px;
    }

    .video-title{
      font-size:16px;
      font-weight:500;
      line-height:20px;
      margin-bottom:12px;
    }
    .video-author,
    .video-stats{
      font-size: 13px;
      line-height:20px;
      color:rgb(96, 96, 96);
    }

    .video-preview{
      margin-bottom:8px;
    }
  </style>
</head>
<body>
  <div class="video-list">
    <div class="video-preview">
      <div class="thumbnail-column">
        <img class="thumbnail" src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-3.webp" alt="">
      </div>
      <div class="video-info">
        <p class="video-title">
          Crazy Tik Toks Taken Moments Before DISASTER
        </p>
        <p class="video-author">
          SSSniperWolf
        </p>
        <p class="video-stats">
          12M views &#183; 1 year ago
        </p>
      </div>
    </div>

    <div class="video-preview">
      <div class="thumbnail-column">
        <img class="thumbnail" src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-5.webp" alt="">
      </div>
      <div class="video-info">
        <p class="video-title">
          Kadane's Algorithm to Maximum Sum Subarray Problem
        </p>
        <p class="video-author">
          CS Dojo
        </p>
        <p class="video-stats">
          519k views &#183; 5 years ago
        </p>
      </div>
    </div>

    <div class="video-preview">
      <div class="thumbnail-column">
        <img class="thumbnail" src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-6.webp" alt="">
      </div>
      <div class="video-info">
        <p class="video-title">      
          Anything You Can Fit In The Circle I’ll Pay For
        </p>
        <p class="video-author">
          MrBeast
        </p>
        <p class="video-stats">
          141M views &#183; 1 year ago
        </p>
      </div>
    </div>

  </div>
</body>
</html>
