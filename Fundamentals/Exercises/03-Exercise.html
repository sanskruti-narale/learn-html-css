<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p{
      font-family:arial;
      margin:0;
    }
    .stock{
      margin-top:10px;
      margin-bottom:10px;
    }
    .no1{
      font-size: 30px;
    }
    .no2{
      color:rgb(107, 105, 105)
    }
    .growth{
      color:green;
    }
    .txt{
      margin-top:10px;
      margin-bottom:10px;
    }
    .t1{
      color:rgb(107, 105, 105);
    }
    .t2{
      color:red;
    }
  </style>
</head>
<body>
  <p class="stock">
    <span class="no1">1,049.61</span><span class="no2"> USD</span>
  </p>
  <p class="growth">
    &plus;18.05 (1.75&percnt;) today
  </p>
  <p class="txt">
    <span class= "t1">After hours 1,048.00 </span>
    <span class="t2">&minus;1.61 (0.15&percnt;)</span>
  </p>
</body>
</html>
