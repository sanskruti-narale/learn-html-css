<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display-property</title>
  <style>
    .pickup-location{
      border:none;
      background-color:rgb(228, 224, 224);
      padding:10px 20px;
      border-radius: 2px;
      margin:10px 0px;
      width:280px
    }
    .destination{
      border:none;
      background-color:rgb(228, 224, 224);
      padding:10px 20px;
      border-radius: 2px;
      display:block;
      width:280px;
    }
    .request-button{
      background-color:rgb(0, 0, 0);
      color:white;
      padding:10px 20px;
      border:none;
      border-radius: 2px;
      margin-top:30px;
      margin-right:10px;
    }
    .schedule-button{
      background-color:rgb(228, 224, 224);
      color:black;
      padding:10px 20px;
      border:none;
      border-radius: 2px;
      margin-top:10px;
    }
  </style>
</head>
<body>
  <h1>Request a ride now</h1>
  <input class="pickup-location" type="text" name="pickup-location" placeholder="Enter pickup location">
  <input type="text" placeholder="Enter destination" class="destination">
  <button class="request-button">Request now</button>
  <button class="schedule-button">Schedule for later</button>
</body>
</html>
