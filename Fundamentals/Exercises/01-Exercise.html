<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            color:rgb(0,113,133)
        }
        .product{
            font-weight:bold;
            font-size:25px;
        }
        .rs{
            color:rgb(0, 119, 0);
            font-size:20px;
        }
        .cart-button{
            background-color: rgb(255,216,20);
            border:none;
            height:35px;
            width:120px;
            border-radius:19px;
            margin-right:10px;
            font-weight: bold;
        }
        .buy-button{
            background-color: rgb(255,164,28);
            border:none;
            height:35px;
            width:120px;
            border-radius:19px;
            margin-right:10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <a href="amazon.in">Back to Amazon</a>
    <p class="product">Nike Black Running Shoes</p>
    <p class="rs">$39 - in stock.</p>
    <p>Free delivery tomorrow.</p>
    <button class="cart-button">Add to cart</button>
    <button class="buy-button">Buy now</button>
</body>
</html>
