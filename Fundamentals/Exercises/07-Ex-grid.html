<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Exercise</title>

  <style>
    body{
      font-family: Roboto, Arial;
      margin:0;
    }

    .card-grid{
      margin-left:10px;
      margin-top:12px;
      display:grid;
      grid-template-columns:200px 200px 200px;
      column-gap:10px;
    }

    .card{
      width:200px;
      display:inline-block;
      box-shadow: 3px 3px 4px gray;
    }

    .profile{
      padding-top: 5px;
      margin-top:6px;
      display:grid;
      grid-template-columns:30px 1fr;
      column-gap:9px;
      align-items: center;
    }

    .image{
      width:100%;
    }

    .profile-pic{
      width:30px;
      border-radius:30px;
    }

    .text{
      padding:10px 0 12px 8px;
    }

    .name{
      margin:0;
      font-weight: bold;
    }
    .friends{
      margin:0;
      color:rgb(90, 89, 89);
      font-size:16px;
    }
    .add-button{
      background-color:rgb(12, 92, 211);
      color: white;
      border:none;
      border-radius:4px;
      padding:6px 10px;
      margin-top:12px;
    }
  </style>
</head>
<body>
  <div class="card-grid">
    <div class="card">
      <img class="image" src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-1.webp" alt="image1">
      <div class="text">
        <p class="name">Oliver</p>
        <div class="profile">
          <img class="profile-pic" src="../../Projects/youtube-clone-webpage/channel-pictures/channel-1.jpeg" alt="channel pic">
          <p class="friends">
            2 mutual friends
          </p>
        </div>
        <button class="add-button">Add Friend</button>
      </div>
    </div>

    <div class="card">
    <img class="image" src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-2.webp" alt="image1">
    <div class="text">
      <p class="name">Jennifer</p>
      <div class="profile">
          <img class="profile-pic" src="../../Projects/youtube-clone-webpage/channel-pictures/channel-2.jpeg" alt="channel pic">
          <p class="friends">
            2 mutual friends
          </p>
        </div>
      <button class="add-button">Add Friend</button>
    </div>
  </div>

  <div class="card">
    <img class="image" src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-3.webp" alt="image1">
    <div class="text">
      <p class="name">Lucas</p>
      <div class="profile">
          <img class="profile-pic" src="../../Projects/youtube-clone-webpage/channel-pictures/channel-3.jpeg" alt="channel pic">
          <p class="friends">
            2 mutual friends
          </p>
        </div>
      <button class="add-button">Add Friend</button>
    </div>
  </div>
</body>
</html>
