<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position Exercise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <style>
    .container{
       position: relative;
       background-color: gray;
       width:500px;
       height:400px;
       border-radius: 5px;
    }

    img {
      border-radius: 5px;
      width: 100%;
      height:100%;
      object-fit: cover;
    }

    .discount {
      background-color: black;
      color: white;
      position: absolute;
      top: 10px;
      right: 0;
      padding: 5px 8px;
      font-size: 17px;
      font-weight: 500;
      font-family: roboto,arial;
    }

    .cart{
      background-color: rgba(255, 255, 255, 0.8);
      position:absolute;
      bottom: 0;
      left: 0;
      right:0;
      height:100px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      background-color: white;
      border: 1px solid black;
      padding:10px 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../../Projects/youtube-clone-webpage/thumbnails/thumbnail-1.webp" alt="">
    <div class="discount">20 &percnt; OFF</div>
    <div class="cart">
      <button>Add to Cart</button>
    </div>
  </div>
</body>
</html>
