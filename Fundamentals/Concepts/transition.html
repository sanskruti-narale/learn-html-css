<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .req-btn{
            background-color: black;
            color:white;
            border:none;
            font-weight:bold;
            margin-right: 8px;
            margin-left:8px;
            cursor:pointer;
            border-radius:3px;
            padding:10px;
            transition:opacity 0.15s;
            vertical-align:top;
        }
        .req-btn:hover{
            opacity:0.8;
        }    
        .req-btn:active{
            opacity:0.5;
        }    
        .join-button{
            color:rgb(6, 96, 212);
            background-color:white;
            border:1px solid rgb(24, 125, 207);
            border-radius: 2px;
            cursor:pointer;
            margin-left:8px;
            padding:9px;
            transition:background-color 0.15s,
            	color 0.15s;
        }
        .join-button:hover{
            background-color: rgb(6, 96, 212);
            color:white;
        }
        .join-button:active{
            opacity:0.7;
        }
        .tweet-button{
            background-color: rgb(6, 96, 212);
            color:white;
            border:none;
            padding: 10px 12px ;
            border-radius: 18px;
            font-weight:bold;
            font-size:15px;
            cursor:pointer;
            margin-left:8px;
			transition:box-shadow 0.15s;
            vertical-align: top;
        }
				.tweet-button:hover{
					box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
				}
        
    </style>
</head>
<body>
    <button class="req-btn">REQUEST NOW</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>
    
    
</body>
</html>
