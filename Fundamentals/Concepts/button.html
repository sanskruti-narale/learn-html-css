<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons Practice</title>
    <style>
        .req-btn{
            background-color: black;
            color:white;
            border:none;
            width:120px;
            height:36px;
            margin-left:8px;
        }
        .join_button{
            color:rgb(24, 125, 207);
            background-color:white;
            border:1px solid rgb(24, 125, 207);
            height:36px;
            width:62px;
            border-radius: 2px;
            cursor:pointer;
            margin-left:8px;
        }
        .tweet_button{
            background-color: rgb(2, 150, 255);
            color:white;
            border:none;
            height:36px;
            width:75px;
            border-radius: 18px;
            font-weight:bold;
            font-size:15px;
            cursor:pointer;
            margin-left:8px;
        }
        
    </style>
</head>
<body>
    <button class="req-btn">Request now</button>
    <button class="join_button">JOIN</button>
    <button class="tweet_button">Tweet</button>
    
    
</body>
</html>
